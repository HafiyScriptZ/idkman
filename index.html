// BULLETPROOF UPLOAD: Tries mclo.gs first, falls back to paste.gg if blocked
function uploadPaste(content) {
  var formData = new FormData();
  formData.append('content', content);
  return fetch('https://api.mclo.gs/1/log', { method: 'POST', body: formData })
    .then(function(r) { 
      if (!r.ok) throw new Error('mclo failed');
      return r.json(); 
    })
    .then(function(j) {
      if (j.success && j.id) return "https://api.mclo.gs/1/raw/" + j.id;
      throw new Error('mclo no id');
    })
    .catch(function() {
      return fetch('https://api.paste.gg/v1/pastes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: "HAFIY PASTE",
          files: [{ name: "script.lua", content: { format: "text", value: content } }]
        })
      })
      .then(function(r) { return r.json(); })
      .then(function(j) {
        if (j.status === 'success' && j.result && j.result.files && j.result.files[0]) {
          return "https://api.paste.gg/v1/pastes/" + j.result.id + "/files/" + j.result.files[0].id + "/raw";

        throw new Error('paste.gg failed');
      });
    });
}

  for(var L=0;L<3;L++)payload=buildLayer(payload);
  if(document.getElementById("anti").checked)payload=ANTI+payload;
  document.getElementById("so").value=payload;
  st.className="";st.textContent="Done ("+payload.length+" chars, 3 layers)";
}
if(lsG("hafiyKey")==="1")enter();
</script>
